; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:huzzah]
platform = espressif8266@2.6.3
board = huzzah
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
	ArtnetWifi
	I2Cdev
	MPU6050
	FastLED@3.4.0
	ArduinoJson
	AsyncJson
	ESP8266WiFi
	ESP8266mDNS
	ESP32Async/ESPAsyncTCP
	me-no-dev/ESPAsyncWebServer@1.2.4
	FS
	Wire
    WebSockets@2.3.6

; Convenience env for OTA uploads over WiFi instead of USB.
; upload_port is set to the device's mDNS hostname - change it to match
; your device's configured AP Name (Settings page) or its IP address.
; Usage: pio run -e huzzah_ota -t upload    (firmware)
;        pio run -e huzzah_ota -t uploadfs  (filesystem/data)
[env:huzzah_ota]
extends = env:huzzah
upload_protocol = espota
upload_port = featherwing1.local
upload_flags =
    --auth=NimbusPiOTA
