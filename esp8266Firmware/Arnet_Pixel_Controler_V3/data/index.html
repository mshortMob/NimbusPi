                }
                input.parentElement.classList.toggle('rowDeemphasized', deemphasized);
                input.disabled=deemphasized;
            }

            // Send OSC only makes sense when the ESP itself is reading its
            // own accelerometer - Mobile mode can't actually transmit OSC
            // (browsers have no API to send raw UDP/OSC packets - see
            // startMobileAccelerometer()), so it's greyed out the same as
            // Disabled. The OSC IP/Port/Path fields additionally depend on
            // Send OSC itself being enabled.
            function updateOscFieldsAvailability(){
                var accelInput=document.getElementById('accelerometer_mode');
                var sendOscInput=document.getElementById('send_osc');
                if(!accelInput || !sendOscInput){
                    return;
                }
                var isAccelEnabled=(accelInput.value=='1');
                setFieldDeemphasized('send_osc', !isAccelEnabled);
                var oscFieldsAvailable = isAccelEnabled && sendOscInput.value=='1';
                ['osc_ip','osc_port','osc_path_x','osc_path_y','osc_path_z'].forEach(function(name){
                    setFieldDeemphasized(name, !oscFieldsAvailable);
                });
            }

            var mobileMotionListenerActive=false;

            function updateAccelerometerMode(mode){
                globals.accelerometerMode=String(mode);
                if(globals.accelerometerMode=='2'){
                    startMobileAccelerometer();
                }else{
                    stopMobileAccelerometer();
                }
            }

            // Browsers have no API to send raw OSC/UDP packets, so Mobile
            // mode can only ever feed the Data-page graphs locally - it
            // can't be relayed onward as OSC (see updateOscFieldsAvailability,
            // which greys Send OSC out whenever accelerometer isn't set to
            // Enabled/ESP-sourced).
            function startMobileAccelerometer(){
                if(mobileMotionListenerActive){
                    return;
                }
                if(typeof DeviceMotionEvent === 'undefined'){
                    console.log('DeviceMotionEvent not supported on this browser - cannot use Mobile accelerometer mode here.');
                    return;
                }
                if(typeof DeviceMotionEvent.requestPermission === 'function'){
                    // iOS 13+ requires this to be called from within a user
                    // gesture - the Settings page Save button click
                    // qualifies. If this runs outside one (e.g. on page
                    // load, before the user has saved Mobile mode from this
                    // browser this session), the browser silently declines
                    // and motion events simply won't fire until the next
                    // gesture-triggered attempt (e.g. hitting Save again).
                    DeviceMotionEvent.requestPermission().then(function(state){
                        if(state=='granted'){
                            window.addEventListener('devicemotion', handleMobileDeviceMotion);
                            mobileMotionListenerActive=true;
                        }else{
                            console.log('Device motion permission not granted.');
                        }
                    }).catch(function(e){
                        console.log('Device motion permission request failed.', e);
                    });
                }else{
                    window.addEventListener('devicemotion', handleMobileDeviceMotion);
                    mobileMotionListenerActive=true;
                }
            }

            function stopMobileAccelerometer(){
                if(!mobileMotionListenerActive){
                    return;
                }
                window.removeEventListener('devicemotion', handleMobileDeviceMotion);
                mobileMotionListenerActive=false;
            }

            function handleMobileDeviceMotion(event){
                var accel=event.accelerationIncludingGravity || event.acceleration;
                if(!accel){
                    return;
                }
                // Rough normalization of raw m/s^2 readings (including
                // gravity, so roughly -20..+20 in practice) into the 0..1
                // range the existing graphs/buffer expect - there's no way
                // to match the ESP's own sensor/scaling exactly, this is
                // only an approximation for visual purposes.
                function normalize(v){
                    var out=((v||0)+20)/40;
                    if(out<0){ out=0; }
                    if(out>1){ out=1; }
                    return out;
                }
                rotateDataHistoryBuffer([
                    normalize(accel.x),
                    normalize(accel.y),
                    normalize(accel.z),
                    parseFloat(parseInt(globals.selectedPreset-1)/5)+.05
                ]);
            }

            // The Nodes tab makes sense only while GUI Presets (not
            // ArtNet/DMX) are actually driving the LEDs - targeting presets
            // to specific devices has no effect when DMX data is what's
            // playing.
            function updateNodesTabVisibility(controlModeValue){
                globals.controlMode = String(controlModeValue);
                var isArtnet = (globals.controlMode=='1');
                var isAvailable = !isArtnet;
                document.getElementById('navNodes').classList.toggle('navTabHidden', !isAvailable);
                document.getElementById('navMenuNodes').classList.toggle('navTabHidden', !isAvailable);
                // Scenes is just another way to select a preset - equally
                // meaningless in ArtNet/DMX mode, so it follows the same
                // availability rule as the Nodes tab.
                document.getElementById('navScenes').classList.toggle('navTabHidden', !isAvailable);
                document.getElementById('navMenuScenes').classList.toggle('navTabHidden', !isAvailable);
                if(!isAvailable){
                    globals.selectedNodeIds=[];
                    if(globals.currentPage=='nodesPage' || globals.currentPage=='scenesPage'){
                        goToPage('presetsPage');
                    }
                }
            }

            function makeGetSettingsCall(){
                var urlString='http://'+location.host + '/getSettings'
                var xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function() {
                if(this.readyState == 4 && this.status == 200){
                    var getResponse=JSON.parse(this.response);
                    console.log(JSON.parse(this.response));
                    for (var x in globals.settingsPageFields){
                        document.getElementById(globals.settingsPageFields[x].name).value=getResponse[globals.settingsPageFields[x].name];
                    }
                    updateControlModeDot(getResponse['control_mode']);
                    updateNodesTabVisibility(getResponse['control_mode']);
                    updateOscFieldsAvailability();
                    updateAccelerometerMode(getResponse['accelerometer_mode']);
                    globals.lanSelfHostname=getResponse['ap_name'];
                    // Self starts selected by default (see the Nodes page),
                    // but only seed that once - after that it's up to the
                    // user, same as any other node.
                    if(!globals.selfSelectionSeeded){
                        globals.selfSelectionSeeded=true;
                        if(globals.selectedNodeIds.indexOf(globals.lanSelfHostname)==-1){
                            globals.selectedNodeIds.push(globals.lanSelfHostname);
                        }
                    }
                    loadInitialPresetState();
                }
                };
                xhttp.open('GET', urlString, true);
                xhttp.setRequestHeader('Content-Type', 'application/json')
                xhttp.send();
            }

            // Greys the Save button out while a save is in flight, then
            // briefly flashes it a dull green/red for success/failure
            // (including no response inside 10s) before it settles back to
            // its normal default look. Uses inline styles rather than CSS
            // classes so this always wins regardless of the button's own
            // #saveButton/:hover rules, and a requestId guard so an old,
            // already-timed-out request can't still flash a stale result
            // after a newer save has started.
            var saveButtonRequestId=0;
            function setSaveButtonState(state){
                var btn=document.getElementById('saveButton');
                if(!btn){
                    return;
                }
                if(state=='pending'){
                    btn.disabled=true;
                    btn.style.backgroundColor='var(--bg-elevated)';
                    btn.style.color='var(--text-secondary)';
                    btn.style.cursor='not-allowed';
                }else if(state=='success'){
                    btn.style.backgroundColor='#3f7d52';
                    btn.style.color='var(--text-primary)';
                }else if(state=='error'){
                    btn.style.backgroundColor='#8a3f3f';
                    btn.style.color='var(--text-primary)';
                }else{
                    btn.disabled=false;
                    btn.style.backgroundColor='';
                    btn.style.color='';
                    btn.style.cursor='';
                }
            }

            function flashSaveButton(state){
                setSaveButtonState(state);
                setTimeout(function(){
                    setSaveButtonState('default');
                },900);
            }

            function makeUpdateSettingsCall(){
                var payload={};
                for (var x in globals.settingsPageFields){
                    payload[globals.settingsPageFields[x].name]=document.getElementById(globals.settingsPageFields[x].name).value;
                }
                var urlString='http://'+location.host + '/updateSettings'
                var xhttp = new XMLHttpRequest();
                var requestId=++saveButtonRequestId;
                var settled=false;
                setSaveButtonState('pending');
                var timeoutHandle=setTimeout(function(){
                    if(settled || requestId!=saveButtonRequestId){
                        return;
                    }
                    settled=true;
                    xhttp.abort();
                    flashSaveButton('error');
                },10000);
                xhttp.onreadystatechange = function() {
                    if(this.readyState == 4){
                        if(settled || requestId!=saveButtonRequestId){
                            return;
                        }
                        settled=true;
                        clearTimeout(timeoutHandle);
                        if(this.status == 200){
                            console.log(this.responseText);
                            flashSaveButton('success');
                        }else{
                            flashSaveButton('error');
                        }
                    }
                };
                xhttp.open('POST', urlString, true);
                xhttp.setRequestHeader('Content-Type', 'application/json')
                xhttp.send(JSON.stringify(payload));
                updateControlModeDot(payload['control_mode']);
                updateNodesTabVisibility(payload['control_mode']);
                updateOscFieldsAvailability();
                updateAccelerometerMode(payload['accelerometer_mode']);
            }

            // Fetches every preset's whole-fleet active index + per-slot
            // types up front (tiny - a couple dozen ints), then this
            // device's own currently-active preset's full content. Replaces
            // the old whole-bank fetch: none of the OTHER 15 presets'
            // content is ever transferred unless something actually needs
            // to view/edit them.
            function loadInitialPresetState(){
                var urlString='http://'+location.host+'/getPresetIndex';
                var xhttp=new XMLHttpRequest();
                xhttp.onreadystatechange=function(){
                    if(this.readyState==4 && this.status==200){
                        var resp=JSON.parse(this.response);
                        globals.selectedPreset=parseInt(resp["selectedPreset"])+1;
                        globals.numPresets=resp["presetTypes"].length;
                        showBankContaining(globals.selectedPreset);
                        var selfNd=getNodeData(globals.lanSelfHostname);
                        selfNd.presetTypes=resp["presetTypes"];
                        selfNd.indexLoaded=true;
                        ensureNodePresetLoaded(globals.lanSelfHostname, globals.selectedPreset);
                        refreshPresetsDisplay();
                    }
                };
                xhttp.open('GET', urlString, true);
                xhttp.send();
            }

            function postToHost(host, path, payload){
                var urlString='http://'+host+path;
                var xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function() {
                    if(this.readyState == 4 && this.status == 200){
                        console.log(this.responseText);
                    }
                };
                xhttp.open('POST', urlString, true);
                xhttp.setRequestHeader('Content-Type', 'application/json')
                xhttp.send(JSON.stringify(payload));
            }

            // There's no device-to-device relay at all: the browser sends
            // one independent request directly to each selected device's
            // own address, using location.host for whichever selected entry
            // is this device (guaranteeing that particular request stays
            // same-origin, no CORS involved).
            function resolveNodeAddress(hostname){
                if(hostname==globals.lanSelfHostname){
                    return location.host;
                }
                return globals.lanPeerAddresses[hostname] || hostname;
            }

            function makeEmptyPixelMap(){
                var pixelMap=[];
                for(var x=0;x<8;x++){
                    var row=[];
                    for(var y=0;y<8;y++){ row.push(0); }
                    pixelMap.push(row);
                }
                return pixelMap;
            }

            function makeDefaultLedPresetValues(){
                var ledPresets=[];
                for(var s=0;s<8;s++){ ledPresets.push(128); }
                return ledPresets;
            }

            // Per-node data store - see the comment on globals.nodeData.
            // presetTypes covers all globals.numPresets slots (fetched via
            // /getPresetIndex - cheap), while each slot's full content
            // lives in presets{}, populated lazily on demand.
            function getNodeData(hostname){
                if(!globals.nodeData[hostname]){
                    var defaultTypes=[];
                    for(var i=0;i<globals.numPresets;i++){ defaultTypes.push(1); }
                    globals.nodeData[hostname]={
                        presetTypes: defaultTypes,
                        indexLoaded: false,
                        indexLoading: false,
                        presets: {},
                    };
                }
                return globals.nodeData[hostname];
            }

            // A single (node, preset index) content record - {ledPresets,
            // pixelMap, presetType}. Created as an unloaded stub on first
            // reference so it's always safe to read/write immediately.
            function getNodePresetEntry(hostname, presetIndex){
                var nd=getNodeData(hostname);
                if(!nd.presets[presetIndex]){
                    nd.presets[presetIndex]={
                        ledPresets: makeDefaultLedPresetValues(),
                        pixelMap: makeEmptyPixelMap(),
                        presetType: 1,
                        loaded: false,
                        loading: false,
                    };
                }
                return nd.presets[presetIndex];
            }

            function setNodePresetType(hostname, presetIndex, typeStr){
                var typeInt=(typeStr=="pixel") ? 1 : 0;
                getNodeData(hostname).presetTypes[presetIndex-1]=typeInt;
                getNodePresetEntry(hostname, presetIndex).presetType=typeInt;
            }

            // Retrieves a node's preset-type index (cheap) the first time
            // it's identified (see renderLanPeersList), then its currently-
            // active preset's full content, so a newly-discovered node's
            // current values are ready to show/recall as soon as it's
            // selected. Skips the Content-Type header deliberately - these
            // are simple GETs with no body, and adding it would turn a
            // same-origin-or-not GET into a CORS preflight-triggering
            // request for no benefit.
            function ensureNodeIndexLoaded(hostname){
                var nd=getNodeData(hostname);
                if(nd.indexLoaded || nd.indexLoading){
                    return;
                }
                nd.indexLoading=true;
                var address=resolveNodeAddress(hostname);
                var xhr=new XMLHttpRequest();
                xhr.onreadystatechange=function(){
                    if(this.readyState==4){
                        nd.indexLoading=false;
                        if(this.status==200){
                            try{
                                var resp=JSON.parse(this.response);
                                nd.presetTypes=resp["presetTypes"];
                                nd.indexLoaded=true;
                            }catch(e){}
                        }
                        ensureNodePresetLoaded(hostname, globals.selectedPreset);
                        refreshPresetsDisplay();
                    }
                };
                xhr.open('GET', 'http://'+address+'/getPresetIndex', true);
                xhr.send();
            }

            function ensureNodePresetLoaded(hostname, presetIndex){
                var entry=getNodePresetEntry(hostname, presetIndex);
                if(entry.loaded || entry.loading){
                    return;
                }
                entry.loading=true;
                var address=resolveNodeAddress(hostname);
                var xhr=new XMLHttpRequest();
                xhr.onreadystatechange=function(){
                    if(this.readyState==4){
                        entry.loading=false;
                        if(this.status==200){
                            try{
                                var resp=JSON.parse(this.response);
                                entry.ledPresets=resp["ledPresets"];
                                entry.pixelMap=resp["pixelMap"];
                                entry.presetType=resp["presetType"];
                                entry.loaded=true;
                            }catch(e){}
                        }
                        refreshPresetsDisplay();
                    }
                };
                xhr.open('GET', 'http://'+address+'/getPreset?index='+(presetIndex-1), true);
                xhr.send();
            }

            // Fetches a specific (hostname, presetIndex) preset fresh
            // (bypassing the cache) and hands it to callback - used by copy
            // mode, where acting on stale cached data would be wrong.
            function fetchPresetForCopy(hostname, presetIndex, callback){
                var address=resolveNodeAddress(hostname);
                var xhr=new XMLHttpRequest();
                xhr.onreadystatechange=function(){
                    if(this.readyState==4 && this.status==200){
                        try{
                            var resp=JSON.parse(this.response);
                            callback({ledPresets:resp["ledPresets"], pixelMap:resp["pixelMap"], presetType:resp["presetType"]});
                        }catch(e){}
                    }
                };
                xhr.open('GET', 'http://'+address+'/getPreset?index='+(presetIndex-1), true);
                xhr.send();
            }

            // Applies a live edit (slider drag, pixel paint) to every
            // currently-selected node's own stored copy of the preset
            // currently being viewed, so each node keeps its own values
            // instead of all selected nodes being forced to match whichever
            // one is shown.
            function applyToSelectedNodes(fn){
                (globals.selectedNodeIds || []).forEach(function(hostname){
                    fn(getNodePresetEntry(hostname, globals.selectedPreset), hostname);
                });
            }

            // Recomputes the flat display fields (what syncView() renders)
            // from the current selection's per-node data, for whichever
            // preset is currently selected/viewed. With exactly one node
            // effectively selected, shows that node's own values as-is.
            // With more than one, values the selected nodes disagree on are
            // masked out (see mixedSliderMask/mixedPixelMask) so a single
            // arbitrary value is never shown as if it were shared.
            function refreshPresetsDisplay(){
                var selected=(globals.selectedNodeIds || []).slice();
                var representative=selected.length>0 ? selected[0] : globals.lanSelfHostname;
                if(!representative){
                    return;
                }
                ensureNodeIndexLoaded(representative);
                ensureNodePresetLoaded(representative, globals.selectedPreset);
                var repEntry=getNodePresetEntry(representative, globals.selectedPreset);
                globals.presetType = (repEntry.presetType==1) ? "pixel" : "synth";
                globals.synthSliderValues = repEntry.ledPresets.slice();
                globals.pixelMap = repEntry.pixelMap.map(function(row){ return row.slice(); });
                if(selected.length>1){
                    selected.forEach(function(h){
                        ensureNodeIndexLoaded(h);
                        ensureNodePresetLoaded(h, globals.selectedPreset);
                    });
                    globals.mixedSliderMask=[];
                    for(var s=0;s<8;s++){
                        var sliderVals=selected.map(function(h){ return getNodePresetEntry(h, globals.selectedPreset).ledPresets[s]; });
                        globals.mixedSliderMask[s]=sliderVals.some(function(v){ return v!=sliderVals[0]; });
                    }
                    globals.mixedPixelMask=[];
                    for(var px=0;px<8;px++){
                        globals.mixedPixelMask[px]=[];
                        for(var py=0;py<8;py++){
                            var pixelVals=selected.map(function(h){ return getNodePresetEntry(h, globals.selectedPreset).pixelMap[px][py]; });
                            globals.mixedPixelMask[px][py]=pixelVals.some(function(v){ return v!=pixelVals[0]; });
                        }
                    }
                }else{
                    globals.mixedSliderMask=null;
                    globals.mixedPixelMask=null;
                }
                syncView();
            }

            function sendLedPresetsToNode(hostname){
                var entry=getNodePresetEntry(hostname, globals.selectedPreset);
                var payload={"index":globals.selectedPreset-1, "ledPresets":entry.ledPresets, "presetType":entry.presetType};
                postToHost(resolveNodeAddress(hostname), '/updateLedPresets', payload);
            }

            function sendPixelMapToNode(hostname){
                var entry=getNodePresetEntry(hostname, globals.selectedPreset);
                var payload={"index":globals.selectedPreset-1, "pixelMap":entry.pixelMap};
                postToHost(resolveNodeAddress(hostname), '/updatePixelMap', payload);
            }

            function makeUpdateLedPresetsCall(){
                globals.presetValueDebounceTime=new Date().getTime();
                (globals.selectedNodeIds || []).forEach(sendLedPresetsToNode);
            }

            function makeUpdatPixelMapCall(){
                (globals.selectedNodeIds || []).forEach(sendPixelMapToNode);
            }

            // The Scenes-page Save button: (re-)persists the currently
            // selected preset's synth/pixel data to every known node's own
            // file (see preset_store.h), for that node's own already-cached
            // copy of this preset - not just whichever nodes happen to be
            // selected. Skips any node whose data for this preset was never
            // actually fetched (still the default stub) - sending that
            // would overwrite the node's real stored data with placeholder
            // defaults instead of saving anything real.
            function saveCurrentPresetToAllNodes(){
                (globals.lastKnownPeers || []).forEach(function(peer){
                    var entry=getNodePresetEntry(peer.hostname, globals.selectedPreset);
                    if(!entry.loaded){
                        return;
                    }
                    sendLedPresetsToNode(peer.hostname);
                    sendPixelMapToNode(peer.hostname);
                });
                var btn=document.getElementById('scenesSaveButton');
                if(!btn){
                    return;
                }
                btn.style.backgroundColor='#3f7d52';
                btn.style.borderColor='#3f7d52';
                setTimeout(function(){
                    btn.style.backgroundColor='';
                    btn.style.borderColor='';
                },900);
            }

            // Selecting a preset (Presets or Scenes page) is fleet-wide by
            // design, unlike editing a preset's content - every known node
            // is told to switch, regardless of the Nodes-page selection.
            // The command itself is just an index (see /selectPreset), not
            // any preset's content, so this stays cheap no matter how many
            // nodes or presets exist.
            function selectPresetEverywhere(presetNum){
                // Same debounce guard the websocket handler already checks
                // for slider/pixel edits - without it, the device's own
                // periodic websocket broadcast (still reporting the OLD
                // active preset until the /selectPreset POST below actually
                // reaches and is processed by every node) races this local
                // update, briefly reverting the display back to the old
                // preset before the broadcast catches up and corrects it.
                globals.presetValueDebounceTime=new Date().getTime();
                globals.selectedPreset=presetNum;
                showBankContaining(presetNum);
                var payload={"index":presetNum-1};
                var targets={};
                targets[location.host]=true;
                (globals.lastKnownPeers || []).forEach(function(peer){
                    targets[resolveNodeAddress(peer.hostname)]=true;
                });
                Object.keys(targets).forEach(function(address){
                    postToHost(address, '/selectPreset', payload);
                });
                refreshPresetsDisplay();
            }

            // Only drops a selected id after it's been missing for several
            // consecutive refreshes in a row, rather than the very first
            // one - a transient discovery miss shouldn't silently and
            // permanently degrade a multi-device selection down to fewer
            // devices without ever being unchecked.
            function pruneStaleSelection(knownIds){
                globals.missingSelectionCounts=globals.missingSelectionCounts||{};
                var stillKnown={};
                knownIds.forEach(function(id){ stillKnown[id]=true; });
                globals.selectedNodeIds=globals.selectedNodeIds.filter(function(id){
                    if(stillKnown[id]){
                        delete globals.missingSelectionCounts[id];
                        return true;
                    }
                    globals.missingSelectionCounts[id]=(globals.missingSelectionCounts[id]||0)+1;
                    return globals.missingSelectionCounts[id]<3;
                });
            }

            // Mirrors the Nodes-page checkbox list as a column of buttons
            // on the Presets page itself, so a node can be targeted without
            // leaving the page being edited. Height is shared out evenly
            // across however many nodes are currently known (see the
            // .presetNodeButton flex-grow/max-height CSS), so it shrinks as
            // more nodes come online and stays capped at a sane size when
            // there are only a few.
            // Measures how wide a label's text would render on a single
            // line - matching the real label's font/weight/letter-spacing
            // exactly (copied from an already-rendered label, rather than
            // re-derived, so this can't drift out of sync with the CSS) -
            // via an off-screen probe forced to nowrap. Used to decide
            // whether a hostname would actually wrap in its button, rather
            // than relying on the browser's own after-the-fact wrap
            // behavior (which depends on flex layout timing/quirks that
            // proved unreliable here).
            function measureNaturalLabelWidth(text, referenceLabelEl){
                var probe=document.createElement('span');
                var refStyle=window.getComputedStyle(referenceLabelEl);
                probe.style.position='absolute';
                probe.style.visibility='hidden';
                probe.style.whiteSpace='nowrap';
                probe.style.left='-9999px';
                probe.style.top='0';
                probe.style.fontSize=refStyle.fontSize;
                probe.style.fontWeight=refStyle.fontWeight;
                probe.style.fontFamily=refStyle.fontFamily;
                probe.style.letterSpacing=refStyle.letterSpacing;
                probe.innerHTML=text;
                document.body.appendChild(probe);
                var width=probe.offsetWidth;
                document.body.removeChild(probe);
                return width;
            }

            function renderPresetNodeSelectorButtons(peers){
                var container=document.getElementById('presetNodeSelectorContainer');
                if(!container){
                    return;
                }
                container.innerHTML='';
                var entries=peers || [];
                var labelEls=[];
                entries.forEach(function(peer){
                    var btn=document.createElement('button');
                    var isSource=copySourceMatches('node', peer.hostname);
                    btn.className='presetNodeButton'+((!isSource && globals.selectedNodeIds.indexOf(peer.hostname)!=-1) ? ' selected' : '');
                    if(isSource){
                        btn.style.backgroundColor='#f2a93c';
                        btn.style.color='#2a1d08';
                        btn.style.borderColor='#f2a93c';
                    }
                    btn.title=peer.hostname;
                    btn.dataset.hostname=peer.hostname;
                    var label=document.createElement('span');
                    label.className='presetNodeButtonLabel';
                    label.innerHTML=peer.hostname;
                    btn.appendChild(label);
                    btn.onclick=(function(hostname){
                        return function(){ toggleNodeSelection(hostname); };
                    })(peer.hostname);
                    container.appendChild(btn);
                    labelEls.push(label);
                });
                // Narrow screens (e.g. a phone in portrait) don't have room
                // for full hostnames in this column - if any one name's
                // actual unwrapped width exceeds the space available in its
                // button, switch every button to a plain top-to-bottom
                // 1,2,3... enumeration instead, rather than letting some
                // wrap and others not.
                var anyOverflows=false;
                for(var i=0;i<labelEls.length;i++){
                    var btn=labelEls[i].parentElement;
                    var style=window.getComputedStyle(btn);
                    var available=btn.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
                    var natural=measureNaturalLabelWidth(entries[i].hostname, labelEls[i]);
                    if(natural > available){
                        anyOverflows=true;
                        break;
                    }
                }
                if(anyOverflows){
                    labelEls.forEach(function(label, i){ label.innerHTML=(i+1); });
                }
                // Copy toggle - lives in the same column as the node
                // buttons above, pinned to the bottom (margin-top:auto)
                // regardless of how many node buttons there are, so its
                // bottom always lines up with the sliders/color picker.
                var copyBtn=document.createElement('button');
                copyBtn.id='copyModeButton';
                copyBtn.className='presetNodeButton copyToggleButton'+(globals.copyModeEnabled ? ' selected' : '');
                var copyLabel=document.createElement('span');
                copyLabel.className='presetNodeButtonLabel';
                copyLabel.id='copyModeButtonLabel';
                copyLabel.innerHTML='Copy';
                copyBtn.appendChild(copyLabel);
                copyBtn.onclick=function(){ toggleCopyMode(); };
                container.appendChild(copyBtn);
                var copyStyle=window.getComputedStyle(copyBtn);
                var copyAvailable=copyBtn.clientWidth - parseFloat(copyStyle.paddingLeft) - parseFloat(copyStyle.paddingRight);
                if(anyOverflows || measureNaturalLabelWidth('Copy', copyLabel) > copyAvailable){
                    copyLabel.innerHTML='C';
                }
            }

            function toggleNodeSelection(nodeId){
                if(globals.copyModeEnabled){
                    handleCopyModeClick('node', nodeId);
                    return;
                }
                var idx=globals.selectedNodeIds.indexOf(nodeId);
                if(idx==-1){
                    globals.selectedNodeIds.push(nodeId);
                }else{
                    globals.selectedNodeIds.splice(idx,1);
                }
                renderPresetNodeSelectorButtons(globals.lastKnownPeers || []);
                refreshPresetsDisplay();
            }

            function refreshNodesPage(){
                makeGetLanPeersCall();
            }

            function selectAllNodes(){
                if(globals.copyModeEnabled){
                    return;
                }
                globals.selectedNodeIds=(globals.lastKnownNodeIds || []).slice();
                renderPresetNodeSelectorButtons(globals.lastKnownPeers || []);
                refreshPresetsDisplay();
                refreshNodesPage();
            }

            function clearNodeSelection(){
                if(globals.copyModeEnabled){
                    return;
                }
                globals.selectedNodeIds=[];
                renderPresetNodeSelectorButtons(globals.lastKnownPeers || []);
                refreshPresetsDisplay();
                refreshNodesPage();
            }

            function makeGetLanPeersCall(){
                var urlString='http://'+location.host + '/getLanPeers'
                var xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function() {
                    if(this.readyState == 4 && this.status == 200){
                        var getResponse=JSON.parse(this.response);
                        console.log(getResponse);
                        renderLanPeersList(getResponse['peers'] || []);
                    }
                };
                xhttp.open('GET', urlString, true);
                xhttp.setRequestHeader('Content-Type', 'application/json')
                xhttp.send();
            }

            function renderLanPeersList(peers){
                globals.lastKnownPeers=peers;
                globals.lastKnownNodeIds=peers.map(function(p){ return p.hostname; });
                globals.lastKnownManualPeers=peers.filter(function(p){ return p.source=='manual'; }).map(function(p){ return p.hostname; });
                // The browser sends preset updates directly to each selected
                // device's own address (see resolveNodeAddress), rather than
                // having one device relay to the others - so it needs each
                // peer's real address, and which one is this device
                // (addressed via location.host instead, to guarantee that
                // particular request stays same-origin).
                globals.lanPeerAddresses={};
                globals.lanSelfHostname="";
                peers.forEach(function(p){
                    globals.lanPeerAddresses[p.hostname]=p.ip || p.hostname;
                    if(p.isSelf==1){
                        globals.lanSelfHostname=p.hostname;
                    }
                });
                pruneStaleSelection(globals.lastKnownNodeIds);
                // Retrieve each newly-identified node's current values so
                // they're ready to show/recall as soon as it's selected.
                peers.forEach(function(p){ ensureNodeIndexLoaded(p.hostname); });
                renderPresetNodeSelectorButtons(peers);
                refreshPresetsDisplay();
                var container=document.getElementById('nodesListContainer');
                container.innerHTML='';
                if(peers.length==0){
                    var empty=document.createElement('div');
                    empty.id='nodesEmptyMessage';
                    empty.innerHTML='No LAN peers found yet.';
                    container.appendChild(empty);
                    return;
                }
                for(var i=0;i<peers.length;i++){
                    var peer=peers[i];
                    var row=document.createElement('div');
                    row.className='nodeRow';

                    var checkbox=document.createElement('input');
                    checkbox.type='checkbox';
                    checkbox.className='nodeRowCheckbox';
                    checkbox.checked=(globals.selectedNodeIds.indexOf(peer.hostname)!=-1);
                    // Disabled during copy mode - its native checked state
                    // would otherwise flip on click even though selection
                    // itself isn't what a click means right now (see
                    // toggleNodeSelection/handleCopyModeClick).
                    checkbox.disabled=globals.copyModeEnabled;
                    checkbox.onchange=(function(hostname){
                        return function(){ toggleNodeSelection(hostname); };
                    })(peer.hostname);
                    row.appendChild(checkbox);
                    if(copySourceMatches('node', peer.hostname)){
                        row.style.backgroundColor='#f2a93c';
                        row.style.color='#2a1d08';
                    }

                    var hostname=document.createElement('span');
                    hostname.className='nodeRowHostname';
                    hostname.innerHTML=peer.hostname + (peer.isSelf==1 ? ' (this device)' : '');
                    row.appendChild(hostname);

                    if(peer.ip){
                        var ipBadge=document.createElement('span');
                        ipBadge.className='nodeRowBadge';
                        ipBadge.innerHTML=peer.ip;
                        row.appendChild(ipBadge);
                    }else if(peer.source=='manual'){
                        var pendingBadge=document.createElement('span');
                        pendingBadge.className='nodeRowBadge';
                        pendingBadge.innerHTML='not yet seen';
                        row.appendChild(pendingBadge);
                    }

                    var settingsButton=document.createElement('button');
                    settingsButton.className='nodeRowSettingsButton';
                    settingsButton.title='Open settings';
                    settingsButton.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
                    settingsButton.onclick=(function(hostname){
                        return function(e){
                            e.stopPropagation();
                            window.location.href='http://'+resolveNodeAddress(hostname)+'/index.html#settingsPage';
                        };
                    })(peer.hostname);
                    row.appendChild(settingsButton);

                    if(peer.source=='manual'){
                        var removeButton=document.createElement('button');
                        removeButton.className='nodeRowRemoveButton';
                        removeButton.innerHTML='&times;';
                        removeButton.title='Remove';
                        removeButton.onclick=(function(hostname){
                            return function(){ removeLanPeer(hostname); };
                        })(peer.hostname);
                        row.appendChild(removeButton);
                    }

                    row.onclick=(function(checkbox){
                        return function(e){
                            if(e.target===checkbox || e.target.tagName=='BUTTON'){
                                return;
                            }
                            checkbox.checked=!checkbox.checked;
                            checkbox.onchange();
                        };
                    })(checkbox);

                    container.appendChild(row);
                }
            }

            function saveLanPeers(peerList){
                var payload={"peers":peerList};
                var urlString='http://'+location.host + '/updateLanPeers'
                var xhttp = new XMLHttpRequest();
                xhttp.onreadystatechange = function() {
                    if(this.readyState == 4 && this.status == 200){
                        makeGetLanPeersCall();
                    }
                };
                xhttp.open('POST', urlString, true);
                xhttp.setRequestHeader('Content-Type', 'application/json')
                xhttp.send(JSON.stringify(payload));
            }

            function addLanPeer(){
                var input=document.getElementById('lanPeerAddInput');
                var value=input.value.trim();
                if(!value){
                    return;
                }
                var current=(globals.lastKnownManualPeers || []).slice();
                if(current.indexOf(value)==-1){
                    current.push(value);
                }
                input.value='';
                saveLanPeers(current);
            }

            function removeLanPeer(hostname){
                var current=(globals.lastKnownManualPeers || []).filter(function(h){ return h!=hostname; });
                saveLanPeers(current);
            }

            // A single failed connection attempt fires BOTH onerror and
            // onclose, and the periodic health-check in window.onload can
            // ALSO decide a reconnect is needed at the same time - without
            // this guard, all three independently schedule their own
            // initWebSocket() call, and under real-world WiFi contention
            // (more likely to make the very first handshake fail) those
            // pile up into several overlapping connection attempts. That's
            // exactly what a captured crash log showed: the same client
            // opening 5 WebSocket connections in a row, crashing the
            // device's WebSocketsServer right on the 5th. This ensures at
            // most one reconnect is ever pending regardless of how many of
            // the three triggers fire.
            var socket; // was never actually declared before - only ever
                        // created via assignment inside initWebSocket(),
                        // which made referencing it beforehand (as the new
                        // reconnect guard below needs to) throw.
            var wsReconnectScheduled=false;
            function scheduleWebSocketReconnect(){
                if(wsReconnectScheduled){
                    return;
                }
                wsReconnectScheduled=true;
                setTimeout(function(){
                    wsReconnectScheduled=false;
                    console.log("retrying websocket connection initialization");
                    initWebSocket();
                },1000);
            }

            function initWebSocket(){
                if(socket){
                    // Detach the outgoing socket's handlers first, so a
                    // late-firing event from it can't also schedule a
                    // reconnect on top of the fresh one we're about to open.
                    socket.onopen=null;
                    socket.onerror=null;
                    socket.onclose=null;
                    socket.onmessage=null;
                    try{ socket.close(); }catch(e){}
                }
                socket = new WebSocket("ws:/" + "/" + location.host + ":81");
                socket.onopen = function(e) {
                    console.log("[socket] socket.onopen ");
                    globals.socketConnectivityCheck=new Date().getTime();
                };
                socket.onerror = function(e) {
                    console.log("[socket] socket.onerror ");
                    console.log(e);
                    scheduleWebSocketReconnect();
                };
                socket.onclose = function(e) {
                    console.log("[socket] socket.onclose ");
                    console.log(e);
                    scheduleWebSocketReconnect();
                };
                socket.onmessage = function(e) {
                    console.log('Received data from websocket: '+e.data);
                    globals.socketConnectivityCheck=new Date().getTime();
                    var incomingData=e.data.split(',');
                    var incomingPreset=parseInt(incomingData[incomingData.length-1])%globals.numPresets;
                    // Only plot the ESP's own accelerometer data when that's
                    // actually the active source - in Mobile mode the graphs
                    // are driven by handleMobileDeviceMotion() instead, and
                    // in Disabled mode neither source should update them.
                    if(globals.accelerometerMode=='1'){
                        rotateDataHistoryBuffer([parseFloat(incomingData[0]),parseFloat(incomingData[1]),parseFloat(incomingData[2]),parseFloat(parseInt(incomingData[3])/5)+.05 ]);
                    }
                    if( (new Date().getTime()-globals.presetValueDebounceTime) > 2000){
                        if(globals.selectedPreset!=(incomingPreset+1)){
                            // The physical button was pressed on whichever
                            // device is serving this page - jump straight
                            // to the bank containing the newly-active
                            // preset, same as loading the Presets page does.
                            globals.selectedPreset=(incomingPreset+1);
                            showBankContaining(globals.selectedPreset);
                            refreshPresetsDisplay();
                            console.log('socket change');
                        }
                    }
                    return true;
                };
            }

            function initOrientationListener(){
                var orientation = (screen.orientation || {}).type || screen.mozOrientation || screen.msOrientation;
                processOrientation(orientation);
				window.addEventListener("orientationchange", function() {
                    var orientation = (screen.orientation || {}).type || screen.mozOrientation || screen.msOrientation;
                    processOrientation(orientation);
				}, false);
				window.addEventListener("resume", function() {
                    var orientation = (screen.orientation || {}).type || screen.mozOrientation || screen.msOrientation;
                    processOrientation(orientation);
				}, false);
			}

            function getPlatformOS() {
                const userAgent = window.navigator.userAgent;
                let os = null;
                const isIOS = (/iPad|iPhone|iPod/.test(userAgent) ||
                (/Mac|Mac OS|MacIntel/gi.test(userAgent) && (navigator.maxTouchPoints > 1 || "ontouchend" in document))) && !window.MSStream;

                if (isIOS) {
                    os = 'iOS';
                } else if (/'Win32|Win64|Windows|Windows NT|WinCE/gi.test(userAgent)) {
                    os = 'Windows';
                } else if (/Android/gi.test(userAgent)) {
                    os = 'Android';
                } else if (/Linux/gi.test(userAgent)) {
                    os = 'Linux';
                }

                return os;
            }

            function processOrientation(orientation){
                console.log(orientation+" "+getPlatformOS())
                if (orientation.indexOf("portrait")!=-1 && (getPlatformOS()=='iOS' || getPlatformOS()=='Android' )) {
                    if(document.fullscreenElement==null){
                        document.getElementById("selectedPresetContainer").style.marginTop='50px';
                        document.getElementById("selectedPresetContainer").style.marginBottom='';
                        document.getElementById("selectedPresetContainer").style.height='40%';
                        document.getElementById("pixelMapContainer").style.marginBottom='110px';
                        document.getElementById("colorPickerContainer").style.height='70%';
                    }else{
                        document.getElementById("selectedPresetContainer").style.marginTop='0px';
                        document.getElementById("selectedPresetContainer").style.marginBottom='';
                        document.getElementById("selectedPresetContainer").style.height='60%';
                        document.getElementById("pixelMapContainer").style.marginBottom='50px';
                        document.getElementById("colorPickerContainer").style.height='70%';
                    }
                }else if(orientation.indexOf("landscape")!=-1 && (getPlatformOS()=='iOS' || getPlatformOS()=='Android' )){
                    document.getElementById("selectedPresetContainer").style.marginTop='-16px';
                    document.getElementById("selectedPresetContainer").style.marginBottom='10px';
                    document.getElementById("selectedPresetContainer").style.height='';
                    document.getElementById("pixelMapContainer").style.marginBottom='10px';
                    document.getElementById("colorPickerContainer").style.height='100%';
                }else{
                    document.getElementById("selectedPresetContainer").style.marginTop='';
                    document.getElementById("selectedPresetContainer").style.marginBottom='';
                    document.getElementById("selectedPresetContainer").style.height='';
                    document.getElementById("pixelMapContainer").style.marginBottom='';
                    document.getElementById("colorPickerContainer").style.height='';
                }
            }

        </script>
    </body>
