<html>
    <head>
      <title>NimbusKit</title>
      <link rel="icon" type="image/svg+xml" href="/favicon.svg">
      <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg">
      <style>
        /* theme */
        :root{
            --bg-app: #0a0c11;
            --bg-app-2: #10131a;
            --bg-surface: #151923;
            --bg-surface-2: #1b2029;
            --bg-elevated: #232937;
            --border-subtle: #272d3a;
            --border-strong: #3a4256;
            --text-primary: #eef1f7;
            --text-secondary: #97a1b8;
            --text-muted: #5b647a;
            --accent: #aaaaff;
            --accent-strong: #c2c2ff;
            --accent-contrast: #1a1a33;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-card: 0 2px 10px rgba(0,0,0,0.35);
        }
        *, *::before, *::after{
            box-sizing: border-box;
        }
        html, body{
            height:100%;
            width:100%;
        }
        button, input{
            font-family: inherit;
        }
        button:focus-visible{
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        /* global */
        #background {
            position:absolute;
            display:block;
            height:100%;
            width:100%;
            z-index: 10000;
            background-color: var(--bg-app);
            background-image: radial-gradient(circle at 50% 0%, var(--bg-app-2) 0%, var(--bg-app) 55%);
            overflow: auto;
        }
        body{
          margin: 0px;
          height:100%;
          width:100%;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          background-color: var(--bg-app);
          color: var(--text-primary);
          -webkit-user-select:none;
          user-select:none;
          -webkit-tap-highlight-color: transparent;
        }
        input, textarea{
          -webkit-user-select:text;
          user-select:text;
        }
        #header {
            width:100%;
            height:70px;
            display: flex;
            align-items: stretch;
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            padding: 0 4%;
        }
        #mainLogo{
            font-size: 1.05rem;
            letter-spacing: .04em;
            font-weight: 700;
            color: #f2a93c;
            background: none;
            gap: 4px;
        }
        #mainLogoIcon{
            flex-shrink: 0;
        }
        #headerSpacer{
            flex: 1 1 auto;
        }
        .statusDot{
            width:10px;
            height:10px;
            border-radius:50%;
            align-self:center;
            margin: 0 16px 0 6px;
            flex-shrink:0;
            background-color: #3ecf6e;
            box-shadow: 0 0 6px rgba(62,207,110,0.7);
            transition: background-color .15s ease, box-shadow .15s ease;
        }
        .statusDot.artnet{
            background-color: #e5534b;
            box-shadow: 0 0 6px rgba(229,83,75,0.7);
        }
        .header-item {
            color:var(--text-secondary);
            background-color: transparent;
            font-size: .72rem;
            font-weight:600;
            text-transform: uppercase;
            letter-spacing: .06em;
            text-align: center;
            border: none;
            padding: 0 18px;
            display:flex;
            align-items:center;
            justify-content:center;
            height:100%;
            cursor: pointer;
            transition: color .15s ease, background-color .15s ease;
        }
        .header-item:hover, .header-item:focus-visible{
            color: var(--text-primary);
            background-color: var(--bg-surface-2);
        }
        .nav-btn.active{
            color: var(--accent);
        }
        #navMenuToggle{
            display:none;
            padding: 0 14px;
        }
        #navMenu{
            display:none;
            flex-direction: column;
            position:absolute;
            top:70px;
            left:0;
            width:100%;
            background-color: var(--bg-surface);
            border:1px solid var(--border-subtle);
            border-top:none;
            box-shadow: var(--shadow-card);
            z-index: 20000;
            overflow:hidden;
        }
        #navMenu.open{
            display:flex;
        }
        .navMenuItem{
            background-color: transparent;
            color: var(--text-secondary);
            border:none;
            border-bottom:1px solid var(--border-subtle);
            padding: 16px 4%;
            font-size:.78rem;
            font-weight:600;
            text-transform:uppercase;
            letter-spacing:.06em;
            text-align:left;
            cursor:pointer;
            transition: color .15s ease, background-color .15s ease;
        }
        .navMenuItem:last-child{
            border-bottom:none;
        }
        .navMenuItem:hover, .navMenuItem:focus-visible{
            color:var(--text-primary);
            background-color:var(--bg-surface-2);
        }
        .navMenuItem.active{
            color:var(--accent);
        }
        @media (max-width: 600px){
            .nav-btn{
                display:none;
            }
            #navMenuToggle{
                display:flex;
            }
        }
        #topSpacer{
            width:100%;
            height:24px;
        }
        #bottomSpacer{
            height:20px;
        }
        .page{
            width:90%;
            margin-left:5%;
            height:30px;
            display:none;
        }
        /* dataPage */
        #dataPage{
            grid-template-columns: 20% 80%;
        }
        #dataPageLabelsContainer{
            display:grid;
            grid-template-rows: 25% 25% 25% 25%;
            margin-right:3px;
        }
        #dataPageGraphsContainer{
            display:grid;
            grid-template-rows: 25% 25% 25% 25%;
        }
        .dataPageGraphItem{
            display:grid;
            height: 80%;
            width: 100%;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            background-color: var(--bg-surface);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .dataPageGraphCanvas{
            display:grid;
            width:100%;
            margin:0px;
        }
        .dataPageLabelItem{
            display:grid;
            height: 80%;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            grid-template-rows: 38% 29% 33%;
            margin-right:12px;
            background-color: var(--bg-elevated);
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .dataPageLabelSpacer{
            display:grid;
            align-items: center;
            border: 0px solid black;
            text-align: center;
            height:100%;
            font-weight: 700;
            font-size: .8rem;
            color: var(--text-secondary);
            letter-spacing: .03em;
        }
        /* settingsPage */
        #settingsPage{
            padding-top: 8px;
        }
        .settingsSection{
            margin-bottom: 20px;
        }
        .settingsSectionHeader{
            width:100%;
            height:57px;
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius-md);
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding: 0 16px;
            font-size:.78rem;
            font-weight:700;
            letter-spacing:.02em;
            text-transform: uppercase;
            cursor:pointer;
        }
        .settingsSectionTitle, .settingsSectionChevron{
            pointer-events:none;
        }
        .settingsSectionChevron{
            display:inline-block;
            font-size: 1.56rem;
            line-height: 1;
            color: var(--accent);
            transition: transform .15s ease;
        }
        .settingsSectionHeader.open .settingsSectionChevron{
            transform: rotate(180deg);
        }
        .settingsSectionContent{
            padding-top: 20px;
        }
        .rowDeemphasized{
            opacity: .45;
            pointer-events: none;
        }
        .sectionNote{
            font-size: .62rem;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            color: var(--text-secondary);
            margin-left: 6px;
        }
        .navTabHidden{
            display:none !important;
        }
        .settingsPageRow{
            display: block;
            position: relative;
            height: 43px;
            margin-bottom:36px;
        }
        .settingsPageLabel {
            border: 1px solid var(--border-strong);
            color:var(--text-primary);
            background-color:var(--bg-elevated);
            border-radius: var(--radius-md);
            text-align:center;
            height:43px;
            line-height: 41px;
            font-size:.78rem;
            width:30%;
            display: inline-block;
            vertical-align: top;
            font-weight:600;
            letter-spacing: .02em;
        }
        .settingsPasswordToggle{
            position:absolute;
            right:0;
            top:0;
            height:43px;
            width:36px;
            border:none;
            background:transparent;
            color:var(--bg-app);
            font-size:1rem;
            line-height:1;
            padding:0;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .settingsPageInput, #saveButton{
            background-color: var(--text-primary);
            color: var(--bg-app);
            padding-left: 3%;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            width:68%;
            margin-left:2%;
            display: inline-block;
            height:43px;
            font-size: .85rem;
        }
        #saveButton{
            background-color:var(--accent);
            color: var(--accent-contrast);
            margin-left:0;
            margin-bottom: 36px;
            font-size:.95rem;
            font-weight: 700;
            letter-spacing: .03em;
            text-align: center;
            border: 1px solid var(--accent-strong);
            cursor: pointer;
            width: 100%;
            padding: 0 24px;
            transition: background-color .15s ease;
        }
        #saveButton:hover{
            background-color: var(--accent-strong);
        }
        /* nodesPage */
        #nodesPage{
            padding-top: 8px;
        }
        #nodesPageControls{
            display:flex;
            gap:10px;
            margin-bottom:20px;
        }
        #lanPeersAddRow{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:20px;
        }
        #lanPeersAddRow .nodesControlButton{
            flex:1 1 0;
        }
        .nodesControlButton{
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            height:38px;
            padding:0 16px;
            font-size:.78rem;
            font-weight:600;
            letter-spacing:.02em;
            cursor:pointer;
        }
        .nodesControlButton:hover{
            background-color: var(--bg-surface-2);
        }
        .nodeRow{
            display:flex;
            align-items:center;
            height:57px;
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-md);
            padding: 0 16px;
            margin-bottom:12px;
            cursor:pointer;
        }
        .nodeRowCheckbox{
            width:18px;
            height:18px;
            margin-right:14px;
            accent-color: var(--accent);
            cursor:pointer;
        }
        .nodeRowHostname{
            color: var(--text-primary);
            font-size:.85rem;
            font-weight:700;
            letter-spacing:.02em;
            flex-grow:1;
        }
        .nodeRowBadge{
            font-size:.62rem;
            font-weight:700;
            letter-spacing:.03em;
            text-transform:uppercase;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 3px 8px;
            margin-left:8px;
        }
        .nodeRowBadge.leaderBadge{
            color: var(--accent-contrast);
            background-color: var(--accent);
            border-color: var(--accent-strong);
        }
        .nodeRowRemoveButton{
            background:transparent;
            border:none;
            color: var(--text-secondary);
            font-size:1.1rem;
            line-height:1;
            padding:0 4px;
            margin-left:8px;
            cursor:pointer;
        }
        .nodeRowRemoveButton:hover{
            color: var(--text-primary);
        }
        .nodeRowSettingsButton{
            background:transparent;
            border:none;
            color: var(--text-secondary);
            line-height:1;
            padding:0 4px;
            margin-left:8px;
            cursor:pointer;
            display:flex;
            align-items:center;
        }
        .nodeRowSettingsButton:hover{
            color: var(--text-primary);
        }
        #nodesEmptyMessage{
            color: var(--text-secondary);
            font-size:.8rem;
            text-align:center;
            padding: 30px 0;
        }
        /* scenesPage */
        #scenesPage{
            padding-top: 8px;
        }
        #scenesContentContainer{
            display:flex;
            flex-direction: column;
            height:100%;
            gap:12px;
        }
        #scenesGridContainer{
            display:grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
            flex: 1 1 0;
            min-height: 0;
        }
        .pageSaveButton{
            flex: 0 0 auto;
            height: 50px;
            background-color:var(--accent);
            color: var(--accent-contrast);
            font-size:.95rem;
            font-weight: 700;
            letter-spacing: .03em;
            text-align: center;
            border: 1px solid var(--accent-strong);
            border-radius: var(--radius-md);
            cursor: pointer;
            width: 100%;
            transition: background-color .15s ease;
        }
        .pageSaveButton:hover{
            background-color: var(--accent-strong);
        }
        .sceneButton{
            border-radius: var(--radius-md);
            border: 2px solid var(--border-strong);
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition: background-color .15s ease, color .15s ease, border-color .15s ease;
        }
        .sceneButton.selected{
            background-color: var(--accent);
            color: var(--accent-contrast);
            border-color: var(--accent-strong);
        }
        /* presetsPage */
        #presetsPage{
            grid-template-rows: 3px 12% calc(72% - 3px) 16%;
            grid-template-columns: 92.8% 6.2%;
            column-gap: 1%;
        }
        @media (max-width: 600px) and (orientation: portrait){
            /* Mobile portrait is tighter on width than the node selector
               column needs relative to the sliders/pixel map - trade back
               ~5% of the content column's own width to the selector. */
            #presetsPage{
                grid-template-columns: 88.16% 10.84%;
            }
        }
        #presetNodeSelectorContainer{
            grid-row: 3 / span 2;
            grid-column: 2;
            display:flex;
            flex-direction: column;
            justify-content: flex-start;
            gap:8px;
            overflow:hidden;
        }
        .presetNodeButton{
            flex:1 1 0;
            min-height:0;
            max-height:64px;
            width:100%;
            border-radius: var(--radius-sm);
            border:2px solid var(--border-strong);
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            font-size:.6rem;
            font-weight:700;
            letter-spacing:.02em;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            cursor:pointer;
            padding:2px 4px;
            overflow:hidden;
            transition: background-color .15s ease, color .15s ease, border-color .15s ease;
        }
        .presetNodeButton.selected{
            background-color: var(--accent);
            color: var(--accent-contrast);
            border-color: var(--accent-strong);
        }
        .presetNodeButtonLabel{
            min-width:0;
            width:100%;
            text-align:center;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .copyToggleButton{
            flex: 0 0 36px;
            margin-top: auto;
        }
        .pixel.mixedValue{
            background-color: transparent;
            background-image: repeating-linear-gradient(45deg, var(--bg-elevated) 0 4px, var(--border-strong) 4px 8px);
        }
        #selectedPresetContainer{
            grid-row: 2;
            grid-column: 1 / span 2;
            margin-bottom:20px;
            grid-template-columns: 12% 6% 9% 9% 9% 9% 6% 4% 9% 13.5% 13.5%;
            display: grid;
            margin-top:-6px;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            background-color: var(--bg-surface);
            overflow: hidden;
        }
        .selectedPresetContainerButton, .selectedPresetContainerLabel {
            background-color: var(--bg-elevated);
            color: var(--text-primary);
            height:100%;
            border: none;
            border-right: 1px solid var(--border-subtle);
            margin-left:0px;
            font-size: .68rem;
            font-weight: 600;
            display:flex;
            align-items:center;
            justify-content:center;
            transition: background-color .15s ease, color .15s ease;
        }
        .selectedPresetContainerLabel{
            font-weight: 700;
            background-color: var(--bg-surface-2);
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: .03em;
            font-size: .6rem;
        }
        #selectedPresetTypeSpacer{
            border-top:0px;
            border-bottom: 0px;
            border-right: none;
            background-color: transparent;
        }
        #presetBankLeftArrow:disabled, #presetBankRightArrow:disabled{
            opacity: .35;
            cursor: not-allowed;
        }
        #pixelMapContainer{
            grid-row: 3;
            grid-column: 1;
            background-color: var(--border-subtle);
            z-index: 10;
            margin-bottom:20px;
            display:grid;
            grid-template-columns: auto auto auto auto auto auto auto auto;
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-md);
            gap: 2px;
            overflow: hidden;
        }
        .pixel{
            display:grid;
            background-color: var(--bg-elevated);
        }
        #colorPickerContainer{
            grid-row: 4;
            grid-column: 1;
            border:1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            margin:0px;
            padding:0px;
            height:100%;
            grid-template-columns: auto;
            overflow: hidden;
            box-shadow: var(--shadow-card);
        }
        #cpCanvas{
            display:grid;
            width:100%;
            height:100%;
        }
        #synthSlidersContainer{
            background-color: transparent;
            height:100%;
            display:none;
            flex-direction: column;
            width:100%;
            grid-row: 3 / span 2;
            grid-column: 1;
            margin-left:-3px;
        }
        #labelsDiv {
            display: grid;
            width:100%;
            flex: 0 0 auto;
            height: 24%;
            max-height: 54px;
            grid-template-columns: 12.5% 12.5% 12.5% 12.5% 12.5% 12.5% 12.5% 12.5%;
        }
        #slidersDiv {
            display: grid;
            width:100%;
            flex: 1 1 auto;
            min-height: 0;
            grid-template-columns: auto auto auto auto auto auto auto auto;
        }
        .sliderLabel {
            background-color: var(--bg-elevated);
            width: 100%;
            height: 100%;
            border: 1px solid var(--border-subtle);
            border-bottom: 0px;
            color: var(--text-secondary);
            font-size: 7.5px;
            line-height: 1.15;
            font-weight: 600;
            text-align: center;
            padding: 2px 2px;
            overflow: hidden;
            word-break: normal;
            overflow-wrap: normal;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .sliderLabelShort{
            display:none;
        }
        @media (max-width: 430px){
            .sliderLabelFull{
                display:none;
            }
            .sliderLabelShort{
                display:inline;
            }
        }
        .slider {
            background-color: var(--accent);
            width: 100%;
            height: 100%;
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
        }
      </style>
    </head>
    <body>
        <div id="background">
            <div id="header">
                <button class="header-item" id="mainLogo" onclick="requestFullScreen();">
                    <svg id="mainLogoIcon" viewBox="0 0 24 24" width="35" height="35" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.2 18H6a3.3 3.3 0 0 1-.7-6.53 3.2 3.2 0 0 1 2.2-3.5 2.2 2.2 0 0 1 2 3 3.4 3.4 0 0 1 2.3-3 2.3 2.3 0 0 1 2.5 2.6 3.6 3.6 0 0 1 2.6-2.7 3.8 3.8 0 0 1 2.9 2.83A4.1 4.1 0 0 1 18.2 18Z"/></svg>
                    <span>NimbusKit</span>
                </button>
                <div id="headerSpacer"></div>
                <button class="header-item nav-btn navTabHidden" id="navNodes" onclick="goToPage('nodesPage');">Nodes</button>
                <button class="header-item nav-btn" id="navPresets" onclick="goToPage('presetsPage');">Presets</button>
                <button class="header-item nav-btn navTabHidden" id="navScenes" onclick="goToPage('scenesPage');">Scenes</button>
                <button class="header-item nav-btn" id="navSettings" onclick="goToPage('settingsPage');">Settings</button>
                <button class="header-item nav-btn" id="navData" onclick="goToPage('dataPage');">Data</button>
                <button class="header-item" id="navMenuToggle" onclick="toggleNavMenu();"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                <div class="statusDot artnet" id="controlModeDot" title="Control Source: Loading..."></div>
            </div>
            <div id="navMenu">
                <button class="navMenuItem navTabHidden" id="navMenuNodes" onclick="goToPage('nodesPage');toggleNavMenu(false);">Nodes</button>
                <button class="navMenuItem" id="navMenuPresets" onclick="goToPage('presetsPage');toggleNavMenu(false);">Presets</button>
                <button class="navMenuItem navTabHidden" id="navMenuScenes" onclick="goToPage('scenesPage');toggleNavMenu(false);">Scenes</button>
                <button class="navMenuItem" id="navMenuSettings" onclick="goToPage('settingsPage');toggleNavMenu(false);">Settings</button>
                <button class="navMenuItem" id="navMenuData" onclick="goToPage('dataPage');toggleNavMenu(false);">Data</button>
            </div>
            <div id="topSpacer">
            </div>
            <div id="dataPage" class="page">
                <div id="dataPageLabelsContainer"></div>
                <div id="dataPageGraphsContainer"></div>
            </div>
            <div id="presetsPage" class="page">
                <div id="selectedPresetContainer">
                    <button class="selectedPresetContainerLabel">Number:</button>
                    <button id="presetBankLeftArrow" class="selectedPresetContainerButton" onclick="shiftPresetBank(-1);">&#8592;</button>
                    <button id="selectedPresetButtonSlot1" class="selectedPresetContainerButton" onclick="handleSelectedPresetButton(parseInt(this.innerHTML),'numberbutton')">1</button>
                    <button id="selectedPresetButtonSlot2" class="selectedPresetContainerButton" onclick="handleSelectedPresetButton(parseInt(this.innerHTML),'numberbutton')">2</button>
                    <button id="selectedPresetButtonSlot3" class="selectedPresetContainerButton" onclick="handleSelectedPresetButton(parseInt(this.innerHTML),'numberbutton')">3</button>

                document.addEventListener("click", function(event){
                    var menu=document.getElementById('navMenu');
                    var toggle=document.getElementById('navMenuToggle');
                    if(menu.classList.contains('open') && !menu.contains(event.target) && !toggle.contains(event.target)){
                        toggleNavMenu(false);
                    }
                });
                createDataPage();
                createSettingsPage();
                createPixelMapUI();
                createColorPicker();
                createSynthSliders();
                initOrientationListener();
                // A Nodes-page "Settings" button navigates here with
                // #settingsPage so the freshly-loaded page opens straight to
                // that tab instead of the default Presets page.
                if(window.location.hash){
                    var hashPage=window.location.hash.substring(1);
                    var hashPageEl=document.getElementById(hashPage);
                    if(hashPageEl && hashPageEl.classList.contains('page')){
                        globals.currentPage=hashPage;
                    }
                }
                goToPage(globals.currentPage);
                makeGetSettingsCall();
                makeGetLanPeersCall();
                setInterval(makeGetLanPeersCall, 3000);
                updatePixelMapInterv=setInterval(function(){
                    if(globals.needToUpdatePixelMap){
                        globals.needToUpdatePixelMap=false;
                        makeUpdatPixelMapCall();
                    }
                },1000);
                updateLedPresets=setInterval(function(){
                    if(globals.needToUpdateLedPresets){
                        globals.needToUpdateLedPresets=false;
                        makeUpdateLedPresetsCall();
                    }
                },1000);
                initWebSocket();
                setInterval(function(){
                    var now=new Date().getTime();
                    if( (now-globals.socketConnectivityCheck) > 5000){
                        // Reset the check BEFORE reconnecting (not just on a
                        // successful open) - otherwise, while the connection
                        // is struggling, this fires again every single tick
                        // forever, stacking on top of the onerror/onclose
                        // retries below.
                        globals.socketConnectivityCheck=now;
                        scheduleWebSocketReconnect();
                    }
                },5000);
            }

            window.onresize = function() {
                resizePages();
            };

            // Which 1-indexed preset number a given bank slot (1..4) is
            // currently showing.
            function presetNumberForSlot(slot){
                return globals.presetBankStart + slot;
            }

            function copySourceMatches(type, value){
                return globals.copySource && globals.copySource.type==type && globals.copySource.value==value;
            }

            // The Scenes page is nothing but a full grid of preset-number
            // buttons - same colors/behavior as the Presets page's own
            // preset-number row (including copy mode), just without the
            // 4-at-a-time bank pagination since there's room to show all of
            // them at once.
            function renderScenesPage(){
                var container=document.getElementById('scenesGridContainer');
                if(!container){
                    return;
                }
                container.innerHTML='';
                for(var i=1;i<=globals.numPresets;i++){
                    var btn=document.createElement('button');
                    btn.id='sceneButton'+i;
                    var isSource=copySourceMatches('preset', i);
                    btn.className='sceneButton'+((!isSource && i==globals.selectedPreset) ? ' selected' : '');
                    if(isSource){
                        btn.style.backgroundColor='#f2a93c';
                        btn.style.color='#2a1d08';
                        btn.style.borderColor='#f2a93c';
                    }
                    btn.innerHTML=i;
                    btn.onclick=(function(num){
                        return function(){ handleSelectedPresetButton(num, 'numberbutton'); };
                    })(i);
                    container.appendChild(btn);
                }
            }

            function syncView(){
                // pixel map grid
                for(var x=0;x<globals.numRows;x++){
                    for(var y=0; y<globals.numCols;y++){
                        var pixelMixed=globals.mixedPixelMask && globals.mixedPixelMask[x][y];
                        document.getElementById("pixel_"+x+"_"+y).setValue(globals.pixelMap[x][y], pixelMixed);
                    }
                }
                // color picker
                document.getElementById("cpCanvas").setValue(globals.colorMap[0].length-globals.selectedColor);
                // preset-number bank: 4 visible slots out of globals.numPresets
                for(var slot=1;slot<5;slot++){
                    var presetNum=presetNumberForSlot(slot);
                    var btn=document.getElementById("selectedPresetButtonSlot"+slot);
                    btn.innerHTML=presetNum;
                    if(copySourceMatches('preset', presetNum)){
                        btn.style.backgroundColor='#f2a93c';
                        btn.style.color='#2a1d08';
                        btn.style.borderColor='#f2a93c';
                    }else if(presetNum!=globals.selectedPreset){
                        btn.style.backgroundColor='var(--bg-elevated)';
                        btn.style.color='var(--text-primary)';
                        btn.style.borderColor='var(--border-subtle)';
                    }else{
                        btn.style.backgroundColor='var(--accent)';
                        btn.style.color='var(--accent-contrast)';
                        btn.style.borderColor='var(--border-subtle)';
                    }
                }
                document.getElementById('presetBankLeftArrow').disabled=(globals.presetBankStart<=0);
                document.getElementById('presetBankRightArrow').disabled=(globals.presetBankStart+globals.presetBankSize>=globals.numPresets);
                // selected preset type
                if(globals.presetType=="synth"){
                    document.getElementById("synthTypeButton").style.backgroundColor='var(--accent)';
                    document.getElementById("synthTypeButton").style.color='var(--accent-contrast)';
                    document.getElementById("pixelTypeButton").style.backgroundColor='var(--bg-elevated)';
                    document.getElementById("pixelTypeButton").style.color='var(--text-primary)';
                    document.getElementById("synthSlidersContainer").style.display='flex';
                    document.getElementById("pixelMapContainer").style.display='none';
                    document.getElementById("colorPickerContainer").style.display='none';
                }else{
                    if(globals.presetType=="pixel"){
                        document.getElementById("synthTypeButton").style.backgroundColor='var(--bg-elevated)';
                        document.getElementById("synthTypeButton").style.color='var(--text-primary)';
                        document.getElementById("pixelTypeButton").style.backgroundColor='var(--accent)';
                        document.getElementById("pixelTypeButton").style.color='var(--accent-contrast)';
                        document.getElementById("synthSlidersContainer").style.display='none';
                        document.getElementById("pixelMapContainer").style.display='grid';
                        document.getElementById("colorPickerContainer").style.display='block';
                    }
                }
                // synth slider values
                for(var x=1; x<9; x++){
                    var sliderMixed=globals.mixedSliderMask && globals.mixedSliderMask[x-1];
                    document.getElementById("slider"+x).setValue(globals.synthSliderValues[x-1], sliderMixed);
                }
                renderScenesPage();
                // resize all
                resizePages();
            }

            // Jumps the visible 4-preset bank to whichever one contains a
            // given (1-indexed) preset number - used whenever the Presets
            // page is (re)loaded, and whenever the active preset changes
            // via the physical button/websocket.
            function showBankContaining(presetNum){
                globals.presetBankStart = Math.floor((presetNum-1)/globals.presetBankSize)*globals.presetBankSize;
            }

            function shiftPresetBank(direction){
                var next = globals.presetBankStart + direction*globals.presetBankSize;
                if(next<0 || next>=globals.numPresets){
                    return;
                }
                globals.presetBankStart = next;
                syncView();
            }

            // Copy mode: while enabled, clicking a node or preset-number
            // button no longer selects it - the first click marks a source
            // (highlighted the same dull yellow as the header logo), and
            // the second marks a destination and performs the copy. Shared
            // between the Presets page's node column/preset-number row and
            // the Scenes page's preset buttons - all three call through
            // handleCopyModeClick.
            function toggleCopyMode(){
                globals.copyModeEnabled=!globals.copyModeEnabled;
                globals.copySource=null;
                syncView();
                renderPresetNodeSelectorButtons(globals.lastKnownPeers || []);
            }

            function handleCopyModeClick(type, value){
                if(!globals.copySource || (globals.copySource.type==type && globals.copySource.value==value)){
                    // First pick, or clicking the same source again - (re)arm it.
                    globals.copySource=globals.copySource ? null : {type:type, value:value};
                    syncView();
                    renderPresetNodeSelectorButtons(globals.lastKnownPeers || []);
                    return;
                }
                var source=globals.copySource;
                if(source.type!=type){
                    // One node, one preset number - not a valid pair. Take
                    // no action beyond clearing the source.
                    globals.copySource=null;
                    syncView();
                    renderPresetNodeSelectorButtons(globals.lastKnownPeers || []);
                    return;
                }
                if(type=='preset'){
                    copyPresetToPreset(source.value, value);
                }else{
                    copyNodeToNode(source.value, value);
                }
            }

            function findPresetNodeButtonByHostname(hostname){
                var container=document.getElementById('presetNodeSelectorContainer');
                if(!container){
                    return null;
                }
                var btns=container.querySelectorAll('.presetNodeButton');
                for(var i=0;i<btns.length;i++){
                    if(btns[i].dataset.hostname==hostname){
                        return btns[i];
                    }
                }
                return null;
            }

            // Briefly flashes the given elements a dull green (matching the
            // Save button's own success flash), then clears the copy source
            // and re-renders everything back to normal.
            function flashCopyResult(elements){
                elements.forEach(function(el){
                    if(!el){
                        return;
                    }
                    el.style.backgroundColor='#3f7d52';
                    el.style.color='var(--text-primary)';
                    el.style.borderColor='#3f7d52';
                });
                setTimeout(function(){
                    globals.copySource=null;
                    syncView();
                    renderPresetNodeSelectorButtons(globals.lastKnownPeers || []);
                },900);
            }

            // Copies one preset's content to another, for every known node
            // (each node keeps its own data - this copies within each node,
            // not between nodes). Fetches each node's own current source
            // data fresh rather than trusting the cache, since accuracy
            // matters more here than avoiding one extra request per node.
            function copyPresetToPreset(sourceIndex, destIndex){
                (globals.lastKnownPeers || []).forEach(function(peer){
                    var hostname=peer.hostname;
                    fetchPresetForCopy(hostname, sourceIndex, function(srcData){
                        var destEntry=getNodePresetEntry(hostname, destIndex);
                        destEntry.ledPresets=srcData.ledPresets.slice();
                        destEntry.pixelMap=srcData.pixelMap.map(function(row){ return row.slice(); });
                        destEntry.presetType=srcData.presetType;
                        destEntry.loaded=true;
                        getNodeData(hostname).presetTypes[destIndex-1]=srcData.presetType;
                        postToHost(resolveNodeAddress(hostname), '/updateLedPresets', {"index":destIndex-1, "ledPresets":destEntry.ledPresets, "presetType":destEntry.presetType});
                        postToHost(resolveNodeAddress(hostname), '/updatePixelMap', {"index":destIndex-1, "pixelMap":destEntry.pixelMap});
                        if(destIndex==globals.selectedPreset){
                            refreshPresetsDisplay();
                        }
                    });
                });
                flashCopyResult([
                    document.getElementById('selectedPresetButtonSlot'+(sourceIndex-globals.presetBankStart)),
                    document.getElementById('selectedPresetButtonSlot'+(destIndex-globals.presetBankStart)),
                    document.getElementById('sceneButton'+sourceIndex),
                    document.getElementById('sceneButton'+destIndex),
                ]);
            }

            // Copies one node's data for the currently-viewed preset only
            // to another node.
            function copyNodeToNode(sourceHostname, destHostname){
                fetchPresetForCopy(sourceHostname, globals.selectedPreset, function(srcData){
                    var destEntry=getNodePresetEntry(destHostname, globals.selectedPreset);
                    destEntry.ledPresets=srcData.ledPresets.slice();
                    destEntry.pixelMap=srcData.pixelMap.map(function(row){ return row.slice(); });
                    destEntry.presetType=srcData.presetType;
                    destEntry.loaded=true;
                    getNodeData(destHostname).presetTypes[globals.selectedPreset-1]=srcData.presetType;
                    postToHost(resolveNodeAddress(destHostname), '/updateLedPresets', {"index":globals.selectedPreset-1, "ledPresets":destEntry.ledPresets, "presetType":destEntry.presetType});
                    postToHost(resolveNodeAddress(destHostname), '/updatePixelMap', {"index":globals.selectedPreset-1, "pixelMap":destEntry.pixelMap});
                    if(globals.selectedNodeIds.indexOf(destHostname)!=-1 || globals.selectedNodeIds.indexOf(sourceHostname)!=-1){
                        refreshPresetsDisplay();
                    }

            function createColorPicker(){
                var cpCanvas=document.createElement('canvas');
                cpCanvas.className="cpCanvas"
                cpCanvas.id="cpCanvas"
                cpCanvas.isSelected=false;
                cpCanvas.refreshCanvas=function(){
                    this.width=document.getElementById("colorPickerContainer").offsetWidth;
                    this.height=document.getElementById("colorPickerContainer").offsetHeight;
                    var ctx = this.getContext("2d");
                    ctx.clearRect(0, 0, this.width, this.height);
                    var gradient = ctx.createLinearGradient(0,0,this.width,0);
                    gradient.addColorStop(0, "black");
                    gradient.addColorStop(.1, "blue");
                    gradient.addColorStop(0.33, "green");
                    gradient.addColorStop(.66, "red");
                    gradient.addColorStop(1, "blue");
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, this.width, this.height );
                }
                cpCanvas.updateValue=function(event){
                    this.refreshCanvas();
                    var ctx = this.getContext("2d");
                    var tabWidth=8;
                    if(event.offsetX<0){
                        event.offsetX=0;
                    }
                    if(event.offsetX>this.offsetWidth){
                        event.offsetX=this.offsetWidth;
                    }
                    var tabCenter=(event.offsetX/this.offsetWidth*this.width);
                    ctx.fillStyle = "rgba(255,255,255,0.92)";
                    ctx.fillRect(tabCenter-tabWidth/2, 0, tabWidth, this.height );
                    ctx.strokeStyle = "rgba(10,12,17,0.65)";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(tabCenter-tabWidth/2, 0, tabWidth, this.height );
                    globals.selectedColor=globals.colorMap[0].length-1-parseInt(event.offsetX/this.offsetWidth*globals.colorMap[0].length);
                    if(globals.selectedColor<0){
                        globals.selectedColor=0;
                    }
                    console.log(globals.selectedColor)
                }
                cpCanvas.onmouseup=function(event){
                    this.isSelected=false;
                }
                cpCanvas.onmouseleave=function(event){
                    this.isSelected=false;
                }
                cpCanvas.onmousedown=function(event){
                    this.isSelected=true;
                    this.updateValue(event);
                }
                cpCanvas.onmousemove=function(event){
                    if(this.isSelected){
                        var ctx = this.getContext("2d");
                        this.updateValue(event);
                    }
                }
                cpCanvas.setValue=function(value){
                    this.refreshCanvas();
                    var ctx = this.getContext("2d");
                    var tabWidth=8;
                    var tabCenter=(value/(globals.colorMap[0].length-1)*this.width);
                    ctx.fillStyle = "rgba(255,255,255,0.92)";
                    ctx.fillRect(tabCenter-tabWidth/2, 0, tabWidth, this.height );
                    ctx.strokeStyle = "rgba(10,12,17,0.65)";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(tabCenter-tabWidth/2, 0, tabWidth, this.height );
                }
                cpCanvas.ontouchstart=function(event){
                    this.isSelected=true;
                    event.offsetX=parseInt(event.touches[0].clientX-cpCanvas.offsetLeft);
                    this.updateValue(event);
                }
                cpCanvas.ontouchend=function(event){
                    this.isSelected=false;
                }
                cpCanvas.ontouchcancel=function(event){
                    this.isSelected=false;
                }
                cpCanvas.ontouchmove=function(event){
                    event.offsetX=parseInt(event.touches[0].clientX-cpCanvas.offsetLeft);
                    this.updateValue(event);
                }
                cpCanvas.refreshCanvas();
                cpCanvas.setValue(globals.selectedColor);
                document.getElementById("colorPickerContainer").appendChild(cpCanvas);
            }

                    canvas.id="slider"+x
                    canvas.num=x;
                    canvas.currentChannel=x-1;
                    canvas.isSelected=false;
                    canvas.refresh=function(){
                        this.width=parseInt(document.getElementById("slidersDiv").offsetWidth/8);
                        this.height=parseInt(document.getElementById("slidersDiv").offsetHeight*.8);
                        var mixed=globals.mixedSliderMask && globals.mixedSliderMask[this.num-1];
                        this.setValue(globals.synthSliderValues[this.num-1], mixed);
                    }
                    canvas.updateValue=function(event){
                        var value=255-parseInt(event.offsetY/this.offsetHeight*255);
                        if(value<12){
                            value=0;
                        }
                        this.setValue(value, false);
                        for(var y=1;y<9;y++){
                            if(this.num==y){
                                globals.synthSliderValues[y-1]=value;
                            }
                        }
                        if(globals.mixedSliderMask){
                            globals.mixedSliderMask[this.num-1]=false;
                        }
                        var sliderIdx=this.num-1;
                        applyToSelectedNodes(function(entry){ entry.ledPresets[sliderIdx]=value; });
                        globals.needToUpdateLedPresets=true;
                    }
                    canvas.onmouseup=function(event){
                        this.isSelected=false;
                    }
                    canvas.onmouseleave=function(event){
                        this.isSelected=false;
                    }
                    canvas.onmousedown=function(event){
                        this.isSelected=true;
                        this.updateValue(event);
                    }
                    canvas.onmousemove=function(event){
                        if(this.isSelected){
                            var ctx = this.getContext("2d");
                            this.updateValue(event);
                        }
                    }
                    canvas.setValue=function(value, mixed){
                        var ctx = this.getContext("2d");
                        ctx.clearRect(0, 0, this.width, this.height);
                        if(mixed){
                            // Diagonal hatch across the whole slider instead
                            // of a fill level - the selected nodes disagree
                            // on this value, so there's no single level to
                            // show.
                            ctx.save();
                            ctx.beginPath();
                            ctx.rect(0, 0, this.width, this.height);
                            ctx.clip();
                            ctx.strokeStyle = "#3a4256";
                            ctx.lineWidth = 3;
                            for(var off=-this.height; off<this.width; off+=10){
                                ctx.beginPath();
                                ctx.moveTo(off, this.height);
                                ctx.lineTo(off+this.height, 0);
                                ctx.stroke();
                            }
                            ctx.restore();
                            return;
                        }
                        ctx.fillStyle = "#0a0c11";
                        ctx.fillRect(0, 0, this.width, parseInt((255-value)/255*this.height) );
                    }
                    canvas.ontouchstart=function(event){
                        this.isSelected=true;
                        event.offsetY=parseInt(event.touches[0].clientY-this.offsetTop);
                        this.updateValue(event);
                    }
                    canvas.ontouchend=function(event){
                        this.isSelected=false;
                    }
                    canvas.ontouchcancel=function(event){
                        this.isSelected=false;
                    }
                    canvas.ontouchmove=function(event){
                        if(this.isSelected){
                            var ctx = this.getContext("2d");
                            eventOffsetY=parseInt(event.touches[0].clientY-this.offsetTop);
                            if(eventOffsetY<0){
                                eventOffsetY=0;
                            }
                            if(eventOffsetY>=this.offsetHeight){
                                eventOffsetX=this.offsetHeight;
                            }
                            event.offsetY=eventOffsetY;
                            this.updateValue(event);
                        }
                    }
                    slidersDiv.appendChild(canvas);
                    var sliderLabelValues=[
                        'Color',
                        'Color<wbr>Spread',
                        'Cycle<wbr>Time',
                        'Trail<wbr>Length',
                        'Trail<wbr>Spread',
                        'Direction',

                        '<span class="sliderLabelFull">Brightness</span><span class="sliderLabelShort">Bright</span>'
                    ]
                    var label=document.createElement('span');
